[project]
name = "cozmo-ai"
version = "0.1.0"
description = "Single-room depth reconstruction and measurement pipeline for the Cozmo AI applied AI assignment"
readme = "README.md"
authors = [
    { name = "cyborg-geass", email = "ankit0502.das@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "open3d>=0.19.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
]

[project.scripts]
cozmo-ai = "cozmo_ai:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
